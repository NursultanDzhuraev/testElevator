version: "3.9"

services:
  db:
    image: postgres:15
    container_name: elevator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: elap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elevator-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
